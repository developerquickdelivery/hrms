name: Quality

on:
  push:
    branches: [main, master, hrms-ops]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate app sources
        run: python scripts/validate_app.py
